<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inconvenient Wifi</title>
<style>
  /* Same monochrome palette as Before / Tsundoku: black at night, ivory paper by day. */
  :root { --bg:#000; --fg:#fff; --dim:#a1a1aa; --track:#26262a; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#fffdf4; --fg:#2a2924; --dim:#6b685c; --track:#ddd9c8; }
  }
  body { margin:0; min-height:100vh; display:grid; place-content:center; justify-items:center; gap:20px;
         background:var(--bg); color:var(--fg); font-family:system-ui,sans-serif; }
  .eyebrow { font-size:11px; font-weight:600; letter-spacing:1.5px; color:var(--dim); text-transform:uppercase; }
  #ip { font-size:44px; font-weight:700; letter-spacing:-1.5px; line-height:1; }
  #ip span { color:var(--dim); }
  #ip span.on { color:var(--fg); }
  [hidden] { display:none !important; }
  .view { display:grid; justify-items:center; gap:20px; }
  #list { width:min(360px,90vw); border:1px solid var(--track); border-radius:16px; overflow:hidden; }
  .net { display:flex; justify-content:space-between; align-items:center; padding:16px 18px; cursor:pointer; }
  .net + .net { border-top:1px solid var(--track); }
  .net:hover { background:var(--track); }
  .net b { font-size:16px; letter-spacing:-.2px; }
  .net small { color:var(--dim); font-size:12px; }
  .bars i { font-style:normal; color:var(--track); } .bars i.on { color:var(--fg); }
  button { background:none; color:var(--dim); border:0; font:600 11px system-ui; letter-spacing:1.5px; text-transform:uppercase; cursor:pointer; }
  #board { display:grid; grid-template-columns:repeat(8,1fr); width:min(360px,90vw); aspect-ratio:1; border:1px solid var(--track); border-radius:8px; overflow:hidden; }
  #board div { display:grid; place-content:center; font-size:min(34px,9vw); cursor:pointer; user-select:none; }
  #board .d { background:var(--track); }
  #board .sel { outline:3px solid var(--fg); outline-offset:-3px; }
  #dots { font-size:32px; letter-spacing:6px; min-height:40px; }
  canvas { width:min(360px,90vw); height:auto; aspect-ratio:2/3; border:1px solid var(--track); border-radius:16px; }
</style>
</head>
<body>
<div class="view" id="home">
  <div class="eyebrow">Inconvenient Wifi</div>
  <div id="list"></div>
  <div class="eyebrow" id="status">choose a network</div>
</div>

<div class="view" id="game" hidden>
  <div class="eyebrow" id="title"></div>
  <div id="ip"></div>
  <canvas id="c" width="360" height="540"></canvas>
  <div class="eyebrow" id="msg"></div>
  <button id="back">← networks</button>
</div>

<div class="view" id="pw" hidden>
  <div class="eyebrow" id="pwtitle"></div>
  <div id="dots"></div>
  <div id="board" hidden></div>
  <div class="eyebrow" id="pwmsg"></div>
  <button id="back2">← networks</button>
</div>

<script>
// To connect, die with exactly the network's IP numbers as your score, one run per number, in order.
// Miss one and you start over.
const FAKE = [
  { name: 'FBI Surveillance Van', bars: 4, lock: 1, ip: [12, 1, 2, 24] },
  { name: 'Pretty Fly for a WiFi', bars: 3, lock: 1, ip: [3, 0, 1, 7] },
  { name: 'Tsundoku_5G', bars: 3, lock: 1, ip: [2, 2, 2, 2] },
  { name: 'Before_Guest', bars: 2, lock: 0, ip: [1, 0, 0, 1] },
  { name: 'Not Your Wifi', bars: 1, lock: 1, ip: [4, 2, 0, 5] },
];
const TEST = { name: 'Test Wifi', bars: 4, lock: 0, ip: [0, 0, 0, 0], pw: 'hi' };
// Password per network: set "pw" in networks.json to override, everyone else gets this.
const DEFAULT_PW = 'hunter2';
// Real networks come from networks.json (python scan.py); without it (e.g. deployed) the fake list is used.
// Every network gets a stable home-style IP derived from its name: 192.168.x.y, x and y in 0-255.
const ipFor = name => [192, 168, ...[2, 3].map(i => [...name].reduce((h, c) => (h * 31 + c.charCodeAt(0) + i) % 256, 0))];
const $ = id => document.getElementById(id);
let NETS = [TEST, ...FAKE.map(n => ({ ...n, ip: ipFor(n.name) }))], net, TARGET;

const GRAVITY = 1400, FLAP = -420, SPEED = 160, GAP = 150, SPACING = 220, PIPE_W = 52;  // px, px/s

function openNet(n) {
  net = n; TARGET = n.ip; step = 0;
  $('status').textContent = `connecting to ${n.name}…`;
  setTimeout(() => { $('status').textContent = `${n.name} needs an IP address`; }, 1000);
  setTimeout(() => {
    $('home').hidden = true; $('game').hidden = false;
    $('title').textContent = n.name;
    reset();
  }, 2200);
}
function renderList() { $('list').innerHTML = NETS.map((n, i) => `<div class="net" data-i="${i}"><b>${n.name}</b>
  <span class="bars">${[1, 2, 3, 4].map(b => `<i class="${b <= n.bars ? 'on' : ''}">▮</i>`).join('')} <small>${n.lock ? '🔒' : ''}</small></span></div>`).join(''); }
renderList();
fetch('networks.json').then(r => r.json()).then(real => { NETS = [TEST, ...real.map(n => ({ ...n, ip: ipFor(n.name) }))]; renderList(); }).catch(() => {});
$('list').onclick = e => { const el = e.target.closest('.net'); if (el && $('status').textContent === 'choose a network') openNet(NETS[el.dataset.i]); };
$('back').onclick = $('back2').onclick = () => { $('game').hidden = $('pw').hidden = true; $('home').hidden = false; $('status').textContent = 'choose a network'; };

function judge(step, score, t = TARGET) { return score === t[step] ? step + 1 : 0; }
console.assert(judge(0, 12, [12, 1]) === 1 && judge(1, 2, [12, 1]) === 0, 'judge is broken');

const cv = $('c'), g = cv.getContext('2d'), W = cv.width, H = cv.height;
const css = n => getComputedStyle(document.body).getPropertyValue(n);

let step = 0, state = 'dead', y = 0, vy, score = 0, pipes = [], diedAt = 0;

function showIp() {
  $('ip').innerHTML = TARGET.map((n, i) => `<span class="${i < step ? 'on' : ''}">${i < step ? n : '?'}</span>`).join('<span>.</span>');
}

function reset() {
  y = H / 2; vy = 0; score = 0; pipes = [];
  state = 'ready';
  $('msg').textContent = `run ${step + 1}/${TARGET.length} · die at ${TARGET[step]}`;
  showIp();
}

function die() {
  state = 'dead'; diedAt = performance.now();
  const next = judge(step, score);
  $('msg').textContent = next === 0 ? `died at ${score}, needed ${TARGET[step]} · starting over` : next === TARGET.length ? 'ip accepted · now the password' : `nice · ${TARGET[step]} locked`;
  step = next;
  if (step === TARGET.length) { state = 'done'; setTimeout(startPw, 1500); }
}

function flap() {
  if ($('game').hidden || state === 'done') return;
  if (state === 'dead') {
    if (performance.now() - diedAt < 500) return;  // don't restart off a mashed space
    return reset();
  }
  state = 'play';
  vy = FLAP;
}

let last = performance.now();
function tick(now) {
  const dt = Math.min((now - last) / 1000, 0.05); last = now;

  if (state === 'play') {
    vy += GRAVITY * dt; y += vy * dt;
    if (!pipes.length || pipes[pipes.length - 1].x < W - SPACING) pipes.push({ x: W, gapY: 120 + Math.random() * (H - 240), passed: false });
    for (const p of pipes) {
      p.x -= SPEED * dt;
      if (!p.passed && p.x + PIPE_W < 90) { p.passed = true; score++; }
      if (90 + 12 > p.x && 90 - 12 < p.x + PIPE_W && Math.abs(y - p.gapY) > GAP / 2 - 12) die();
    }
    pipes = pipes.filter(p => p.x > -PIPE_W);
    if (y < 0 || y > H) die();
  }

  g.fillStyle = css('--bg'); g.fillRect(0, 0, W, H);
  g.fillStyle = css('--fg');
  for (const p of pipes) { g.fillRect(p.x, 0, PIPE_W, p.gapY - GAP / 2); g.fillRect(p.x, p.gapY + GAP / 2, PIPE_W, H); }
  g.strokeStyle = css('--fg'); g.lineWidth = 3;
  g.fillStyle = css('--bg');
  g.beginPath(); g.arc(90, y, 12, 0, 7); g.fill(); g.stroke();
  g.fillStyle = css('--dim'); g.font = '700 64px system-ui'; g.textAlign = 'center';
  g.fillText(score, W / 2, 80);
  requestAnimationFrame(tick);
}

// ---- password: every letter costs a mate-in-1. One wrong move wipes the whole password.
// All white to move; "mates" lists every mating move (checked offline with python-chess).
const PUZZLES = [
  { fen: '6k1/5ppp/8/8/8/8/8/R3K3', mates: ['a1a8'] },
  { fen: 'r1bqkbnr/pppp1ppp/2n5/4p2Q/2B1P3/8/PPPP1PPP/RNB1K1NR', mates: ['h5f7'] },
  { fen: 'k7/8/1K6/8/8/8/8/7R', mates: ['h1h8'] },
  { fen: '6rk/6pp/8/6N1/8/8/8/7K', mates: ['g5f7'] },
  { fen: '7k/5Q2/6K1/8/8/8/8/8', mates: ['f7f8', 'f7e8', 'f7h7', 'f7g7'] },
  { fen: 'k7/2K5/8/8/8/8/8/1Q6', mates: ['b1b8', 'b1b7', 'b1a2', 'b1a1'] },
];
const GLYPH = { K: '♔', Q: '♕', R: '♖', B: '♗', N: '♘', P: '♙', k: '♚', q: '♛', r: '♜', b: '♝', n: '♞', p: '♟' };
const sq = i => 'abcdefgh'[i % 8] + (8 - (i >> 3));
let pw, typed, cur, puzzle, sel, grid, lastPuzzle = -1;

function startPw() {
  $('game').hidden = true; $('pw').hidden = false;
  $('pwtitle').textContent = net.name;
  pw = net.pw || DEFAULT_PW; typed = ''; cur = puzzle = null;
  renderPw('type the password · enter to connect');
}

function renderPw(msg) {
  $('dots').textContent = '●'.repeat(typed.length);
  $('pwmsg').textContent = msg;
  $('board').hidden = !puzzle;
  if (!puzzle) return;
  $('board').innerHTML = grid.map((p, i) => `<div class="${(i + (i >> 3)) % 2 ? 'd' : ''} ${sel === i ? 'sel' : ''}" data-i="${i}">${p ? GLYPH[p] + '\uFE0E' : ''}</div>`).join('');
}

function startPuzzle(letter) {
  lastPuzzle = (lastPuzzle + 1 + Math.floor(Math.random() * (PUZZLES.length - 1))) % PUZZLES.length;
  puzzle = PUZZLES[lastPuzzle]; cur = letter; sel = null;
  grid = puzzle.fen.split('/').flatMap(r => [...r].flatMap(c => /\d/.test(c) ? Array(+c).fill('') : c));
  renderPw(`checkmate to unlock letter ${typed.length + 1}`);
}

$('board').onclick = e => {
  const i = +e.target.closest('[data-i]')?.dataset.i;
  if (isNaN(i)) return;
  const mine = grid[i] && grid[i] === grid[i].toUpperCase();
  if (sel === null || (mine && i !== sel)) { if (mine) sel = i; return renderPw($('pwmsg').textContent); }
  if (i === sel) sel = null;
  else if (puzzle.mates.includes(sq(sel) + sq(i))) { typed += cur; puzzle = null; return renderPw('locked in · next letter or enter'); }
  else { typed = ''; puzzle = null; return renderPw('wrong move · password wiped, start over'); }
  renderPw($('pwmsg').textContent);
};

addEventListener('keydown', e => {
  if ($('pw').hidden || puzzle || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'Enter' && typed) {
    const ok = typed === pw;
    typed = ok ? typed : '';
    return renderPw(ok ? `connected to ${net.name} 🛜` : 'wrong password · start over');
  }
  if (e.key.length === 1 && typed !== pw) startPuzzle(e.key);
});

addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) flap(); } });
cv.addEventListener('pointerdown', flap);
requestAnimationFrame(tick);
</script>
</body>
</html>
